[package]
name = "x402-engine"
version = "0.1.0"
edition = "2021"
description = "Storeback Protocol RFC-0402 Wire Engine: Drops checked arithmetic, HTTP 402 challenge/proof serialization, and settlement types"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
base64 = "0.22"
hex = "0.4"
